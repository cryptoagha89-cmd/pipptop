<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PippTop · A little sheep with a big hope</title>
<meta name="description" content="The story of PippTop, a sheep who survived childhood cancer and walks the world to bring hope to every child still fighting.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e3f3f1; --paper:rgba(255,255,255,.72); --hbg:rgba(205,234,238,.88); --g1:#bfe3ea; --g2:#e3f3f1; --g3:#fddcb4; --ink:#1d5560; --soft:#5a7f84; --teal:#2f7c86;
  --gold:#d09a3c; --peach:#fcd8a8; --line:#a9d3d4; --sky:#cdeaee; --brown:#8a4f2a; --fs:1.18rem;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#12303a; --paper:rgba(26,61,72,.8); --hbg:rgba(14,38,48,.9); --g1:#0e2833; --g2:#16394a; --g3:#3d3a3c; --ink:#faf7ee; --soft:#b6d3d4; --teal:#8ccdd2;
  --gold:#f0c06a; --peach:#5b4a3a; --line:#2c5560; --sky:#1d4753; --brown:#f0c06a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12303a; --paper:rgba(26,61,72,.8); --hbg:rgba(14,38,48,.9); --g1:#0e2833; --g2:#16394a; --g3:#3d3a3c; --ink:#faf7ee; --soft:#b6d3d4; --teal:#8ccdd2;
  --gold:#f0c06a; --peach:#5b4a3a; --line:#2c5560; --sky:#1d4753; --brown:#f0c06a;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--g2) linear-gradient(180deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%) fixed;min-height:100vh;color:var(--ink);font-family:var(--sans);line-height:1.6;transition:background .3s,color .3s}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
header{position:sticky;top:0;z-index:5;background:var(--hbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.65rem;font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--ink);text-decoration:none;margin-right:auto}
.mark{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--gold);box-shadow:0 0 0 2px var(--peach)}
.mark img{width:100%;height:100%;object-fit:cover;transform:scale(1.22)}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav a{padding:.4rem .8rem;border-radius:999px;text-decoration:none;color:var(--soft);font-weight:600}
nav a[aria-current="page"]{background:var(--teal);color:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:.4rem .9rem;font-weight:700}
button:hover{border-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:2rem 1.2rem 4rem}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .6em}
h1{font-size:clamp(2.4rem,8vw,4.2rem)}
h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.hero{display:grid;grid-template-columns:1fr;gap:2rem;justify-items:center;text-align:center;padding:1rem 0 2rem}
@media(min-width:760px){.hero{grid-template-columns:1.1fr 1fr;text-align:left;justify-items:start;align-items:center}}
.coin{width:min(320px,78vw);aspect-ratio:1;border-radius:50%;object-fit:cover;object-position:center;border:6px solid var(--gold);box-shadow:0 0 0 8px var(--peach),0 0 0 11px var(--brown);justify-self:center;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.coin{animation:none}html{scroll-behavior:auto}}
.lead{font-size:1.25rem;color:var(--soft);max-width:34ch}
.cta{display:inline-block;margin:.4rem .5rem .4rem 0;padding:.8rem 1.4rem;border-radius:999px;background:var(--teal);color:var(--bg);font-weight:700;text-decoration:none}
.cta.alt{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:1.6rem;margin-top:1.6rem}
.panel p{max-width:68ch}
.pillars{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:1.6rem}
.pillars div{border-left:4px solid var(--brown);padding:.2rem 0 .2rem 1rem}
.pillars strong{font-family:var(--serif);font-size:1.15rem;display:block}
.about{display:grid;gap:1.6rem}
@media(min-width:760px){.about{grid-template-columns:300px 1fr}}
.about img{width:100%;max-width:300px;aspect-ratio:1;object-fit:cover;border-radius:50%;border:6px solid var(--gold);justify-self:center}
.list{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.7rem}
.list a{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;background:var(--paper);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);font-weight:700}
.list a:hover{border-color:var(--gold)}
.list small{color:var(--soft);font-weight:600}
.tools{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
article{max-width:42rem;margin:1rem auto 0}
article h1{font-size:clamp(1.9rem,6vw,2.8rem)}
article .body p{font-family:var(--serif);font-weight:500;font-size:var(--fs);line-height:1.85;margin:0 0 1.3em}
article .body h2{font-size:clamp(1.3rem,3.5vw,1.6rem);margin:2em 0 .6em;color:var(--teal)}
article .body h3{font-size:1.15rem;margin:1.6em 0 .4em;color:var(--ink)}
.fig{margin:1rem 0 2rem}
.fig img{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block}
.fig figcaption{font-size:.85rem;color:var(--soft);text-align:center;margin-top:.5rem}
article .body ul,article .body ol{font-family:var(--serif);font-weight:500;font-size:var(--fs);line-height:1.8;margin:0 0 1.3em;padding-left:1.4em}
article .body li{margin-bottom:.6em}
.await{margin:2.5rem 0 1rem;padding:1.4rem;text-align:center;border-radius:20px;background:var(--peach);color:var(--ink);font-family:var(--serif);font-size:1.3rem}
:root[data-theme="dark"] .await{color:var(--ink)}
.pager{display:flex;justify-content:space-between;gap:.8rem;margin-top:1.6rem;flex-wrap:wrap}
.pager a,.pager span{padding:.7rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);text-decoration:none;font-weight:700}
.pager span{opacity:.4}
.social{display:flex;gap:.7rem;margin-top:1.2rem;justify-content:center}
@media(min-width:760px){.hero .social{justify-content:flex-start}}
.social a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--bg);transition:transform .2s,background .2s}
.social a:hover{background:var(--gold);transform:translateY(-3px)}
.social svg{width:22px;height:22px;fill:currentColor}
.eyebrow{color:var(--soft);font-family:var(--serif);font-size:1.2rem;margin:-.4rem 0 1.6rem}
select{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:.4rem .7rem;cursor:pointer}
.note{background:var(--peach);color:var(--ink);padding:.6rem 1rem;border-radius:12px;font-size:.95rem}
footer{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;color:var(--soft);padding:2rem 1rem 3rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#home" aria-label="PippTop home"><span class="mark"><img src="logo.jpeg" alt=""></span><span>PippTop</span></a>
    <nav aria-label="Main">
      <a href="#home" data-r="home">Home</a>
      <a href="#about" data-r="about">Meet PippTop</a>
      <a href="#chapters" data-r="chapters">Chapters</a>
      <a href="#philosophical" data-r="philosophical">Philosophical</a>
      <a href="#donations" data-r="donations">PIPPTOP Donations</a>
    </nav>
    <select id="lang" aria-label="Language / 语言 / Langue / Idioma"></select>
    <button id="theme" type="button" aria-label="Switch between day and night mode">Night mode</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>

<script src="chapters.js?v=4"></script>
<script src="lang-zh.js?v=4"></script>
<script src="lang-fr.js?v=4"></script>
<script src="lang-es.js?v=4"></script>
<script>
var C = window.CHAPTERS || [];
var SOC = '<div class="social">' +
  '<a href="https://x.com/PIPPTOP?s=20" target="_blank" rel="noopener noreferrer" aria-label="PippTop on X (Twitter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>' +
  '<a href="https://t.me/pipptop" target="_blank" rel="noopener noreferrer" aria-label="PippTop on Telegram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg></a></div>';
var L = window.L = window.L || {};
L.en = {
  title:"PippTop · A little sheep with a big hope",
  nav:{home:"Home",about:"Meet PippTop",chapters:"Chapters",philosophical:"Philosophical",donations:"PIPPTOP Donations"},
  night:"Night mode", day:"Day mode",
  lead:"A little sheep who beat childhood cancer, and now walks the world so no child fights alone.",
  cta1:"Read the latest chapter", cta2:"Meet PippTop",
  pil:[["Hope","Even the smallest spark can light a long road."],["Humanity","Children first, always, before weapons and noise."],["Help","Ordinary people, together, can do what governments will not."]],
  storyH:"A story told one chapter at a time",
  storyP:"PippTop’s journey is only beginning. New chapters arrive step by step, and at the end of each one you will be asked to wait for the next. Come back often.",
  aboutH:"Meet PippTop",
  about:["PippTop is a little sheep from a distant mountain valley. As a young sheep she faced the darkest shadow of her life: childhood cancer. Season by season, the valley healed her, and she stood on the highest cliff with a crown of blossoms and a simple scarf, ready for a new purpose.","She packed a small brown backpack and walked down into the wider world. There she saw leaders pour endless fortunes into machines of war while children in hospital beds went without enough medicine, comfort or care. She refused to stay silent."],
  missionH:"Her mission",
  mission:["PippTop turned to the people: the vibrant memecoin community scattered across every corner of the globe. Her call is simple. Put aside the noise, unite under one banner, and turn the power of community into real-world miracles.","When ordinary people band together with humor, heart and shared purpose, they can accomplish what governments refuse to do. Communities are uniting, not just for charts or trends, but to stand shoulder to shoulder with every child fighting cancer.","From the quietest rural clinics to the busiest city hospitals, PippTop is traveling to visit every child facing the darkness she once knew. She brings warmth where there is fear, laughter where there is pain, and living proof that even the smallest sheep from the furthest valley can help heal the world."],
  start:"Start reading",
  chH:"Chapters", chOne:"{n} chapter is out so far. The next one is on its way.", chMany:"{n} chapters are out so far. The next one is on its way.",
  prev:"Previous", next:"Next chapter", all:"All chapters", await:"Await the next chapter…",
  nf:"Chapter not found", nfp:"This chapter does not exist yet.", home:"Home", read:"Read the story",
  notr:"This part is not translated yet, so it is shown in English.",
  smaller:"Smaller text", larger:"Larger text", footer:"PippTop · A community memecoin for hope."
};
var LANGS = [["en","English"],["zh","中文"],["fr","Français"],["es","Español"]];
var lang = "en";
function T(k){ var d = L[lang] && L[lang][k]; return d !== undefined ? d : L.en[k]; }

var app = document.getElementById("app");
var root = document.documentElement;
var sel = document.getElementById("lang");
sel.innerHTML = LANGS.map(function(x){ return '<option value="'+x[0]+'">'+x[1]+'</option>'; }).join("");

function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

var themeBtn = document.getElementById("theme");
function applyTheme(t){
  root.setAttribute("data-theme", t);
  themeBtn.textContent = T(t === "dark" ? "day" : "night");
}
themeBtn.onclick = function(){
  var t = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(t); save("pt-theme", t);
};
var size = parseFloat(load("pt-size")) || 1.18;
function setSize(d){
  size = Math.min(1.7, Math.max(0.95, size + d));
  root.style.setProperty("--fs", size + "rem"); save("pt-size", size);
}
root.style.setProperty("--fs", size + "rem");

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function renderBody(L){
  var out="", i=0, l;
  while(i<L.length){
    l=L[i];
    if(l.indexOf("\u2022 ")===0){
      out+="<ul>";
      while(i<L.length && L[i].indexOf("\u2022 ")===0){ out+="<li>"+inl(L[i].slice(2))+"</li>"; i++; }
      out+="</ul>";
    } else if(/^\d+\. /.test(l)){
      out+="<ol>";
      while(i<L.length && /^\d+\. /.test(L[i])){ out+="<li>"+inl(L[i].replace(/^\d+\. /,""))+"</li>"; i++; }
      out+="</ol>";
    } else if(l.indexOf("[[img:")===0){
      var m = l.slice(6,-2).split("|");
      out+='<figure class="fig"><a href="'+esc(m[0])+'" target="_blank" rel="noopener"><img src="'+esc(m[0])+'" alt="'+esc(m[1]||"")+'" loading="lazy"></a><figcaption>Tap the picture to open it full size.</figcaption></figure>'; i++;
    } else if(l.indexOf("### ")===0){ out+="<h3>"+inl(l.slice(4))+"</h3>"; i++; }
    else if(l.indexOf("## ")===0){ out+="<h2>"+inl(l.slice(3))+"</h2>"; i++; }
    else { out+="<p>"+inl(l)+"</p>"; i++; }
  }
  return out;
}


function tools(){
  return '<div class="tools"><button type="button" id="sm" aria-label="'+esc(T("smaller"))+'">A−</button><button type="button" id="lg" aria-label="'+esc(T("larger"))+'">A+</button></div>';
}
function note(tr){ return tr ? "" : '<p class="note">' + esc(T("notr")) + '</p>'; }
function pick(key, fb){ var x = L[lang] && L[lang][key]; return x ? {d:x, tr:true} : {d:fb, tr:lang === "en"}; }
function chs(){
  return C.map(function(c,i){
    var x = L[lang] && L[lang].chapters && L[lang].chapters[i];
    return x ? {title:x.title, text:x.text, tr:true} : {title:c.title, text:c.text, tr:lang === "en"};
  });
}

function home(){
  var pil = T("pil").map(function(p){ return '<div><strong>'+esc(p[0])+'</strong>'+esc(p[1])+'</div>'; }).join("");
  return '<section class="hero"><div>' +
    '<h1>PippTop</h1><p class="lead">' + esc(T("lead")) + '</p>' +
    '<a class="cta" href="#chapter-' + C.length + '">' + esc(T("cta1")) + '</a>' +
    '<a class="cta alt" href="#about">' + esc(T("cta2")) + '</a>' + SOC + '</div>' +
    '<img class="coin" src="logo.jpeg" alt="PippTop"></section>' +
    '<div class="pillars">' + pil + '</div>' +
    '<div class="panel"><h2>' + esc(T("storyH")) + '</h2><p>' + esc(T("storyP")) + '</p></div>';
}
function about(){
  var a = T("about").map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("");
  var m = T("mission").map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("");
  return '<div class="about"><img src="logo.jpeg" alt="PippTop"><div><h1>' + esc(T("aboutH")) + '</h1>' + a + '</div></div>' +
    '<div class="panel"><h2>' + esc(T("missionH")) + '</h2>' + m + '<a class="cta" href="#chapters">' + esc(T("start")) + '</a></div>';
}
function chapters(){
  var list = chs();
  var li = list.map(function(c,i){ return '<li><a href="#chapter-'+(i+1)+'"><span>'+esc(c.title)+'</span></a></li>'; }).join("");
  return '<h1>' + esc(T("chH")) + '</h1><p class="lead">' + esc(T(list.length === 1 ? "chOne" : "chMany").replace("{n}", list.length)) + '</p><ul class="list">' + li + '</ul>';
}
function chapter(n){
  var c = chs()[n-1];
  if(!c) return '<h1>' + esc(T("nf")) + '</h1><p>' + esc(T("nfp")) + ' <a href="#chapters">' + esc(T("all")) + '</a></p>';
  var prev = n > 1 ? '<a href="#chapter-'+(n-1)+'">‹ '+esc(T("prev"))+'</a>' : '<span>‹ '+esc(T("prev"))+'</span>';
  var next = n < C.length ? '<a href="#chapter-'+(n+1)+'">'+esc(T("next"))+' ›</a>' : '<span>'+esc(T("next"))+' ›</span>';
  var wait = n === C.length ? '<div class="await">' + esc(T("await")) + '</div>' : '';
  return tools() + '<article><h1>' + esc(c.title) + '</h1>' + note(c.tr) + '<div class="body">' + renderBody(c.text) + '</div>' + wait +
    '<div class="pager">' + prev + '<a href="#chapters">' + esc(T("all")) + '</a>' + next + '</div></article>';
}
function page(key, fb, sub){
  var p = pick(key, fb);
  if(!p.d) return '<h1>…</h1>';
  return tools() + '<article><h1>' + esc(p.d.title) + '</h1>' + (p.d.subtitle ? '<p class="eyebrow">' + esc(p.d.subtitle) + '</p>' : '') + note(p.tr) +
    '<div class="body">' + renderBody(p.d.text) + '</div>' +
    '<div class="pager"><a href="#home">‹ ' + esc(T("home")) + '</a><a href="#chapters">' + esc(T("read")) + ' ›</a></div></article>';
}

function route(){
  var h = (location.hash || "#home").slice(1), key = "home", html;
  if(h === "about"){ key = "about"; html = about(); }
  else if(h === "donations"){ key = "donations"; html = page("donations", window.DONATIONS); }
  else if(h === "philosophical"){ key = "philosophical"; html = page("philosophical", window.PHILOSOPHICAL); }
  else if(h === "chapters"){ key = "chapters"; html = chapters(); }
  else if(/^chapter-\d+$/.test(h)){ key = "chapters"; html = chapter(parseInt(h.slice(8), 10)); }
  else { html = home(); }
  app.innerHTML = html;
  document.querySelectorAll("nav a").forEach(function(a){
    if(a.dataset.r === key) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  var sm = document.getElementById("sm"), lg = document.getElementById("lg");
  if(sm) sm.onclick = function(){ setSize(-0.08); };
  if(lg) lg.onclick = function(){ setSize(0.08); };
  window.scrollTo(0,0);
}
function applyLang(){
  root.lang = lang; document.title = T("title"); sel.value = lang;
  document.querySelectorAll("nav a").forEach(function(a){ a.textContent = T("nav")[a.dataset.r]; });
  applyTheme(root.getAttribute("data-theme") || "light");
  document.getElementById("foot").innerHTML = SOC + '<span>' + esc(T("footer")) + '</span>';
  route();
}
sel.onchange = function(){ lang = sel.value; save("pt-lang", lang); applyLang(); };
var sv = load("pt-lang"), nl = (navigator.language || "en").slice(0,2);
lang = LANGS.some(function(x){ return x[0] === sv; }) ? sv : (LANGS.some(function(x){ return x[0] === nl; }) ? nl : "en");
var st = load("pt-theme");
root.setAttribute("data-theme", st || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
window.addEventListener("hashchange", route);
applyLang();
</script>
</body>
</html>
